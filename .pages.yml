media:
  - name: siteImages
    label: Site images
    input: public
    output: /
    categories: [image]

content:
  - name: home
    label: Home page
    type: file
    path: content/home.json
    operations: { create: false, rename: false, delete: false }
    format: json
    fields:
      - name: metadata
        label: Search preview
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Search description, type: text }
      - name: hero
        label: Main banner
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Main heading, type: text }
          - { name: lede, label: Introductory text, type: text }
          - name: image
            label: Main image
            type: image
            options: { media: siteImages }
          - { name: imageAlt, label: Image description, type: string }
      - name: audiences
        label: Audience panels
        type: object
        list: { collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: title, label: Heading, type: string }
          - { name: body, label: Text, type: text }
      - name: whyChooseUs
        label: Why choose us
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Section heading, type: text }
          - name: items
            label: Reasons
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Heading, type: string }
              - { name: body, label: Text, type: text }
      - name: mission
        label: Our mission
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Section heading, type: text }
          - { name: body, label: Text, type: text }
      - name: services
        label: Services
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Section heading, type: text }
          - name: items
            label: Service links
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Link heading, type: string }
              - { name: description, label: Description, type: text }
              - { name: href, label: Destination (fixed), type: string, readonly: true }
      - name: closing
        label: Closing message
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Heading, type: text }
          - { name: body, label: Text, type: text }

  - name: about
    label: About page
    type: file
    path: content/about.json
    operations: { create: false, rename: false, delete: false }
    format: json
    fields:
      - name: metadata
        label: Search preview
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Search description, type: text }
      - name: hero
        label: Main banner
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Main heading, type: text }
          - { name: subtitle, label: Introductory text, type: text }
      - name: biography
        label: Biography
        type: object
        fields:
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
          - name: image
            label: Portrait
            type: image
            options: { media: siteImages }
          - { name: imageAlt, label: Image description, type: string }
      - name: featuredAward
        label: Featured award
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Award heading, type: text }
          - { name: body, label: Description, type: text }
          - name: image
            label: Award image
            type: image
            options: { media: siteImages }
          - { name: imageAlt, label: Image description, type: string }
      - name: recognition
        label: Other recognition
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Section heading, type: text }
          - { name: body, label: Description, type: text }
          - name: awards
            label: Award images
            type: object
            list: { collapsible: { collapsed: true, summary: "{caption}" } }
            fields:
              - name: image
                label: Award image
                type: image
                options: { media: siteImages }
              - { name: imageAlt, label: Image description, type: string }
              - { name: caption, label: Caption, type: string }

